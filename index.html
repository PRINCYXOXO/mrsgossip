<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m r s g o s s i p — The Diaries</title>

  <!-- 🌟 LINK PREVIEWS & EMBEDS 🌟 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="m r s g o s s i p — The Diaries">
  <meta property="og:description" content="♡ Diaries of a ditz ♡">
  <meta property="og:image" content="https://princyxoxo-site.vercel.app/preview-Princyxoxoxo.png">
  <meta property="og:url" content="https://princyxoxo-site.vercel.app/">

  <!-- 🐦 LARGE IMAGE CARD EMBEDS (Discord / Twitter) 🐦 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="m r s g o s s i p — The Diaries">
  <meta name="twitter:description" content="♡ Diaries of a ditz ♡">
  <meta name="twitter:image" content="https://princyxoxo-site.vercel.app/preview-Princyxoxoxo.png">
  <meta name="theme-color" content="#d23f77">

  <!-- 👑 WEBSITE FAVICON ICON 👑 -->
  <link rel="icon" type="image/png" href="crown2.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
  
  <style>
    /* 1. Clear default browser margins and padding */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 2. Main Body Background (Plain Pink) */
    body {
      background-color: #FEEDF3;
      padding-left: 24px;
    }

    /* 3. Hero Header (Contains the background image up until the banner) */
    .hero-header {
      background-color: #FEEDF3;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      width: 100%;
    }

    /* 4. Logo Container */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding-top: 50px;
      gap: 20px;
    }

    .main-logo,
    .sub-logo {
      max-width: 450px;
      width: 80%;
      height: auto;
      transform: translateX(20px);
    }

    /* 5. Full-bleed banner stretching edge to edge */
    .full-banner {
      width: 100vw;
      max-width: 100vw;
      height: auto;
      display: block;
      margin-top: 40px;
      margin-left: calc(-50vw + 50%);
    }

    /* Custom Pink Text Highlight */
    ::selection {
      background-color: #FEEDF3;
      color: #000000;
    }

    ::-moz-selection {
      background-color: #FEEDF3;
      color: #000000;
    }

    /* -------------------------------------------------------------
      📜 CLASSIC MAC OS IE SIDEBAR (FAR-LEFT FULL SCREEN RAIL)
    ------------------------------------------------------------- */
    .retro-sidebar-tabs {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 24px;
      background-color: #f0f0f0;
      border-right: 1px solid #000000;
      display: flex;
      flex-direction: column;
      z-index: 99999;
      box-sizing: border-box;
    }

    .retro-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 120px;
      text-decoration: none;
      position: relative;
      transition: background-color 0.2s ease;
      box-sizing: border-box;
    }

    .retro-tab:hover {
      background-color: #e0e0e0;
    }

    .retro-tab::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: -2px;
      width: 28px;
      height: 1px;
      background-color: #888888;
      transform: rotate(25deg);
      transform-origin: center;
    }

    .retro-tab-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Geneva', 'Georgia', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #111111;
      letter-spacing: 0.5px;
      user-select: none;
      white-space: nowrap;
    }

    /* Hide on mobile devices */
    @media (max-width: 768px) {
      .retro-sidebar-tabs {
        display: none;
      }
      body {
        padding-left: 0;
      }
    }
  </style>
</head>
<body>

  <!-- 📜 RETRO SIDEBAR TABS 📜 -->
  <div class="retro-sidebar-tabs">
    <a href="scrapbook.html" class="retro-tab">
      <span class="retro-tab-text">Scrapbook</span>
    </a>
    <a href="index.html" class="retro-tab">
      <span class="retro-tab-text">Diary</span>
    </a>
    <a href="closet.html" class="retro-tab">
      <span class="retro-tab-text">Closet</span>
    </a>
  </div>

  <!-- ✨ Background image only shows inside this section up to the banner ✨ -->
  <div class="hero-header">
    <div class="logo-container">
      <img src="princylogo2.png" alt="m r s g o s s i p Logo" class="main-logo">
      <img src="prettiestgina2.png" alt="Prettiest Gina" class="sub-logo">
    </div>
    <img src="banner.png" alt="Banner" class="full-banner">
  </div>

  <!-- Any future content you add below here will be on the plain #FEEDF3 background -->

</body>
</html>
