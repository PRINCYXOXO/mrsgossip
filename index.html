<style>
    /* 1. Clear default browser margins and padding */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* Prevents any accidental horizontal scrollbar */
    }

    /* 2. Main Background */
    body {
      background-color: #FEEDF3;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* 3. Logo Container */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 50px;
      gap: 20px;
    }

    .main-logo,
    .sub-logo {
      max-width: 450px;
      width: 80%;
      height: auto;
      transform: translateX(20px);
    }

    /* 4. Full-bleed banner stretching edge to edge */
    .full-banner {
      width: 100vw;
      max-width: 100vw;
      height: auto;
      display: block; /* Removes bottom gap under the image */
      margin-top: 40px;
      margin-left: calc(-50vw + 50%); /* Ensures it aligns strictly to edge */
    }

    /* Custom Pink Text Highlight */
    ::selection {
      background-color: #FEEDF3;
      color: #000000;
    }

    ::-moz-selection {
      background-color: #FEEDF3;
      color: #000000;
    }

  /* -------------------------------------------------------------
   📜 CLASSIC MAC OS IE SIDEBAR (FAR-LEFT FULL SCREEN RAIL)
------------------------------------------------------------- */
.retro-sidebar-tabs {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 24px; /* Slim vertical rail stuck to the left of the screen */
  background-color: #f0f0f0; /* Light greyish white like original Mac OS IE */
  border-right: 1px solid #000000; /* Dark line separating sidebar from site */
  display: flex;
  flex-direction: column;
  z-index: 99999; /* Stays above everything on screen */
  box-sizing: border-box;
}

.retro-tab {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 120px; /* Space for each vertical text tab */
  text-decoration: none;
  position: relative;
  transition: background-color 0.2s ease;
  box-sizing: border-box;
}

.retro-tab:hover {
  background-color: #e0e0e0; /* Subtle hover gray tint */
}

/* Diagonal separation line between each tab */
.retro-tab::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: -2px;
  width: 28px;
  height: 1px;
  background-color: #888888; /* Diagonal divider line color */
  transform: rotate(25deg); /* Creates the angled slant separator line */
  transform-origin: center;
}

/* Vertical text reading top-to-bottom */
.retro-tab-text {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-family: 'Geneva', 'Georgia', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: #111111; /* Clean black text */
  letter-spacing: 0.5px;
  user-select: none;
  white-space: nowrap;
}

/* Push main wrapper site content right so it doesn't overlap the sidebar */
body {
  padding-left: 24px;
}

/* Hide on mobile devices so it doesn't cover tiny mobile screens */
@media (max-width: 768px) {
  .retro-sidebar-tabs {
    display: none;
  }
  body {
    padding-left: 0;
  }
}
  
  </style>
